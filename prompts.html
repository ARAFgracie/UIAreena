<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORGE/UI — Engineered Prompts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#08090c;color:#f5f5f5}body.light{background:#f4f5f1;color:#111}nav{height:72px;padding:0 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff14;position:sticky;top:0;background:#08090ccc;backdrop-filter:blur(18px)}.light nav{background:#f4f5f1dd}.dots{background:#151820;color:inherit;border:1px solid #ffffff15;border-radius:10px;padding:10px 15px;font-size:18px}.side{position:fixed;right:0;top:0;bottom:0;width:300px;background:#101217;z-index:20;padding:20px;transform:translateX(100%);transition:.3s}.side.open{transform:translateX(0)}.side a,.side button{display:block;width:100%;padding:12px;margin:5px 0;background:#151820;color:#fff;border:1px solid #ffffff12;border-radius:9px;text-decoration:none}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}.overlay.show{display:block}main{width:min(1200px,90%);margin:auto;padding:70px 0}.hero h1{font-size:70px;letter-spacing:-5px}.hero p{color:#888;line-height:1.7;max-width:700px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ffffff12;background:#101217;border-radius:18px;padding:20px}.tag{font:9px monospace;color:#c8ff45}.card h3{font-size:15px}.card p{font-size:11px;color:#888;line-height:1.6}.card button{margin-top:15px;width:100%;padding:10px;border:0;border-radius:9px;background:#c8ff45;color:#111;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(800px,100%);background:#101217;border:1px solid #ffffff12;border-radius:18px;overflow:hidden}.head{padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff12}.head button{padding:8px;border:0;border-radius:8px}.copy{background:#c8ff45}.body{padding:22px;max-height:70vh;overflow:auto;white-space:pre-wrap;font:11px/1.7 monospace;color:#ccc}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.hero h1{font-size:48px}}
</style></head><body><nav><b>FORGE/UI — PROMPTS</b><button class="dots" onclick="openSide()">⋯</button></nav><div class="overlay" id="ov" onclick="closeSide()"></div><aside class="side" id="side"><button onclick="closeSide()">Close</button><a href="index.html">Home</a><a href="architecture.html">Architecture</a><a href="ui-library.html">UI Library</a><a href="navbar.html">Navbar</a><a href="buttons.html">Buttons</a><a href="cards.html">Cards</a><button onclick="document.body.classList.toggle('light')">☼ / ☾ Theme</button></aside><main><section class="hero"><h1>Engineered prompts.</h1><p>Preview the blueprint, then copy the prompt. These are designed to explain website type, page architecture, UX flow and visual direction to AI with less ambiguity.</p></section><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="box"><div class="head"><b id="title"></b><div><button class="copy" onclick="copy()">COPY PROMPT</button><button onclick="closeM()">CLOSE</button></div></div><div class="body" id="body"></div></div></div><script>
const types=["E-commerce","Clothing Store","Personal Blog","News Platform","Portfolio","SaaS","Restaurant","Education","Agency","Startup","Documentation","AI Tool","Photography","Real Estate","Job Platform","Fitness","Travel","Event","Magazine","Freelancer","Online Course","Music Artist","Community","Product Launch","Marketplace","Healthcare","Finance","Podcast","Nonprofit","Creator Brand"];
let current="";grid.innerHTML=types.map((x,i)=>'<article class="card"><div class="tag">WEBSITE BLUEPRINT '+String(i+1).padStart(2,'0')+'</div><h3>'+x+'</h3><p>Architecture, page relationships, responsive UI direction, content hierarchy and implementation guidance.</p><button onclick="openP('+i+')">PREVIEW PROMPT</button></article>').join("");
function openP(i){current=`Build a production-ready ${types[i]} website.\n\nArchitecture:\nDefine the complete page tree and connective user journey before implementation.\n\nRequirements:\n- Responsive desktop and mobile UI\n- Clear navigation and CTA hierarchy\n- Consistent design system\n- Accessibility-conscious interactions\n- Modern visual direction appropriate to the website type\n- Define page-to-page transitions and expected output states\n- Keep components reusable and implementation-ready\n\nDo not create random pages. Every page must have a purpose in the user journey.`;title.textContent=types[i]+" — Engineered Prompt";body.textContent=current;modal.classList.add("show")}function copy(){navigator.clipboard.writeText(current)}function closeM(){modal.classList.remove("show")}function openSide(){side.classList.add("open");ov.classList.add("show")}function closeSide(){side.classList.remove("open");ov.classList.remove("show")}</script></body></html>
