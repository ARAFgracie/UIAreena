<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FORGE/UI — 100 Button Designs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08090c;--s:#101217;--s2:#151820;--t:#f5f5f5;--m:#8d929d;--l:rgba(255,255,255,.09);--a:#c8ff45;--p:#9b7cff;--c:#52e8ff}
body.light{--bg:#f4f5f1;--s:#fff;--s2:#eff0eb;--t:#101114;--m:#686d75;--l:rgba(0,0,0,.09);--a:#7ca900}
body{font-family:Inter,system-ui;background:radial-gradient(circle at 15% 5%,rgba(155,124,255,.14),transparent 25%),var(--bg);color:var(--t);transition:.3s}a{color:inherit;text-decoration:none}
nav{height:72px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.logo{font-weight:900}.logo i{display:inline-block;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--c));vertical-align:middle;margin-right:8px}.dots{background:var(--s);border:1px solid var(--l);color:var(--t);width:40px;height:40px;border-radius:11px;font-size:20px}
.side{position:fixed;right:0;top:0;bottom:0;width:310px;background:var(--s);z-index:100;border-left:1px solid var(--l);padding:22px;transform:translateX(100%);transition:.3s;box-shadow:-20px 0 60px #0004}.side.open{transform:translateX(0)}.side a,.side button{display:block;width:100%;padding:12px;margin:5px 0;background:var(--s2);border:1px solid var(--l);border-radius:10px;color:var(--t);text-align:left}.side .x{background:var(--a);color:#111}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:90}.overlay.show{display:block}
main{width:min(1250px,90%);margin:auto;padding:70px 0}.hero h1{font-size:clamp(42px,7vw,80px);letter-spacing:-5px}.hero p{max-width:650px;color:var(--m);line-height:1.8;margin:18px 0 30px}.search{width:100%;height:52px;background:var(--s);border:1px solid var(--l);border-radius:14px;padding:0 16px;color:var(--t);outline:0;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--s);border:1px solid var(--l);border-radius:18px;overflow:hidden}.preview{height:180px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(155,124,255,.12),transparent 55%),var(--s2)}.item{padding:16px}.item h3{font-size:13px}.item p{font-size:10px;color:var(--m);margin-top:5px;line-height:1.5}.row{display:flex;gap:7px;margin-top:13px}.row select,.row button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--l);background:var(--s2);color:var(--t);font-size:9px}.row button{background:var(--a);color:#111;font-weight:800;cursor:pointer}
.ui-btn{padding:13px 20px;border:0;background:var(--a);color:#111;font-weight:800}.navx{width:90%;padding:12px;background:var(--s);border:1px solid var(--l);border-radius:12px;display:flex;justify-content:space-between;font-size:11px}.cardx{width:85%;padding:20px;border:1px solid var(--l);background:rgba(255,255,255,.05);border-radius:16px}.heroX{font-size:28px;font-weight:900}.inputx{width:85%;padding:13px;border:1px solid var(--l);border-radius:11px;background:var(--s);color:var(--t)}.badge{padding:9px 13px;border-radius:100px;background:var(--a);color:#111;font-size:10px;font-weight:800}.bento{width:85%;display:grid;grid-template-columns:1fr 1fr;gap:5px}.bento i{height:50px;background:var(--s);border:1px solid var(--l);border-radius:8px}.bento i:first-child{grid-row:span 2;height:105px}
.modal{display:none;position:fixed;inset:0;z-index:200;background:#000b;backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(800px,100%);background:var(--s);border:1px solid var(--l);border-radius:20px;overflow:hidden}.mh{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.mh button{padding:8px 12px;border:0;border-radius:8px;background:var(--a)}pre{padding:22px;overflow:auto;max-height:70vh;color:var(--t);font-size:11px;line-height:1.7}
footer{margin-top:70px;padding:30px 5%;border-top:1px solid var(--l);color:var(--m);font-size:10px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="logo"><i></i>FORGE/UI</div><button class="dots" onclick="openSide()">⋯</button></nav>
<div class="overlay" id="ov" onclick="closeSide()"></div>
<aside class="side" id="side"><button class="x" onclick="closeSide()">Close</button><h3 style="margin:20px 0">Dive deeper</h3><a href="index.html">← Home</a><a href="ui-library.html">All UI</a><a href="navbar.html">Navbar</a><a href="buttons.html">Buttons</a><a href="cards.html">Cards</a><a href="forms.html">Forms</a><a href="architecture.html">Architecture</a><a href="prompts.html">Prompts</a><button onclick="theme()">☼ / ☾ Toggle Theme</button></aside>
<main>
<section class="hero"><h1>100 Button Designs</h1><p>Explore 100 curated variants. Every card is a working visual concept with live customization and code preview.</p></section>
<input class="search" id="q" placeholder="Search this library...">
<div class="grid" id="grid"></div>
</main>
<footer>FORGE/UI · 100 design trials · Static frontend library</footer>
<div class="modal" id="modal"><div class="box"><div class="mh"><strong id="mt"></strong><div><button onclick="copy()">COPY</button><button onclick="closeM()">CLOSE</button></div></div><pre id="mc"></pre></div></div>
<script>
const type="button";let current="";
const names={
navbar:["Minimal Glass","Floating","SaaS","Editorial","E-commerce","Fashion","Portfolio","Mega Menu","Pill Nav","Split Nav","Centered","Transparent","Blur","Sticky","Compact","Command","Sidebar","Bottom Mobile","Gradient","Monochrome"],
button:["Minimal CTA","Glass CTA","Magnetic","Liquid","Shimmer","Neon","3D","Pill","Circle","Square","Outline","Ghost","Gradient","Split","Arrow","Download","Play","Add","Delete","Upload"],
card:["Glass Feature","Product","Pricing","Profile","Testimonial","Blog","News","Bento","Stats","Course","Event","Team","Service","Review","Portfolio","Image","Video","Article","Offer","Comparison"],
form:["Email","Search","Login","Signup","Contact","Newsletter","OTP","Checkout","Address","Profile","Feedback","Booking","Payment","Upload","Password","Multi-step","Filter","Range","Date","File"]
};
const base=names[type]||names.card;
const items=Array.from({length:100},(_,i)=>base[i%base.length]+" · "+String(i+1).padStart(2,"0"));
function visual(i){if(type==="navbar")return '<div class="navx"><b>FORGE</b><span>Explore →</span></div>';if(type==="button")return '<button class="ui-btn">'+items[i].split(" · ")[0]+' →</button>';if(type==="forms")return '<input class="inputx" placeholder="Your input...">';if(type==="cards")return '<div class="cardx"><b>'+items[i].split(" · ")[0]+'</b><p>Modern reusable interface.</p></div>';return '<div class="heroX">Build '+(i+1)+'.</div>'}
function render(q=""){grid.innerHTML="";items.forEach((n,i)=>{if(!n.toLowerCase().includes(q))return;let d=document.createElement("article");d.className="card";d.innerHTML='<div class="preview">'+visual(i)+'</div><div class="item"><h3>'+n+'</h3><p>Reusable '+type+' design with production-ready structure.</p><div class="row"><select><option>Live Color</option><option>Lime</option><option>Purple</option><option>Cyan</option></select><select><option>Shape</option><option>Rounded</option><option>Square</option><option>Pill</option></select><button onclick="openCode('+i+')">CODE</button></div></div>';grid.appendChild(d)})}
render();q.oninput=e=>render(e.target.value.toLowerCase());
function openCode(i){current=type+" — "+items[i]+"\n\n<!-- Production-ready "+type+" component -->\n"+visual(i);mt.textContent=items[i];mc.textContent=current;modal.classList.add("show")}function closeM(){modal.classList.remove("show")}function copy(){navigator.clipboard.writeText(current)}function openSide(){side.classList.add("open");ov.classList.add("show")}function closeSide(){side.classList.remove("open");ov.classList.remove("show")}function theme(){document.body.classList.toggle("light");localStorage.setItem("forge",document.body.classList.contains("light")?"light":"dark")}if(localStorage.getItem("forge")==="light")document.body.classList.add("light");
</script></body></html>
