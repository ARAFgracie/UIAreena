<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="UI Areena — Login and create your profile."
>

<title>UI Areena — Welcome</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:#f8fafc;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(124,58,237,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(37,99,235,.18),
            transparent 34%
        ),
        #07070a;

    overflow-x:hidden;

}

/* =========================================================
   BACKGROUND
========================================================= */

.bg-orb{

    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    filter:blur(90px);

    pointer-events:none;

    opacity:.22;

}

.bg-orb.one{

    top:-120px;
    left:-100px;

    background:#7c3aed;

}

.bg-orb.two{

    right:-100px;
    bottom:-120px;

    background:#2563eb;

}

/* =========================================================
   PAGE
========================================================= */

.page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:24px;

    position:relative;

}

/* =========================================================
   BRAND
========================================================= */

.brand{

    position:absolute;

    top:28px;
    left:32px;

    font-size:20px;

    font-weight:850;

    letter-spacing:-.8px;

    user-select:none;

}

.brand span{

    color:#a78bfa;

}

/* =========================================================
   CARD WRAPPER
========================================================= */

.auth-shell{

    width:min(460px,100%);

    position:relative;

}

/* =========================================================
   MAIN CARD
========================================================= */

.auth-card{

    width:100%;

    padding:32px;

    border:1px solid
        rgba(255,255,255,.09);

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.42),
        inset 0 1px 0
        rgba(255,255,255,.04);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    overflow:hidden;

}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{

    margin-bottom:30px;

}

.progress-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

}

.progress-text{

    font-size:12px;

    color:#a1a1aa;

}

.progress-number{

    font-size:12px;

    color:#d4d4d8;

    font-weight:700;

}

.progress-track{

    width:100%;

    height:4px;

    border-radius:100px;

    background:
        rgba(255,255,255,.08);

    overflow:hidden;

}

.progress-fill{

    height:100%;

    width:50%;

    border-radius:100px;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #6366f1
        );

    transition:
        width .45s
        cubic-bezier(.4,0,.2,1);

}

/* =========================================================
   SLIDER
========================================================= */

.slides{

    width:100%;

    overflow:hidden;

}

.slide-track{

    display:flex;

    width:200%;

    transform:translateX(0);

    transition:
        transform .5s
        cubic-bezier(.65,0,.35,1);

}

.slide-track.second{

    transform:translateX(-50%);

}

.slide{

    width:50%;

    flex:none;

    padding:1px;

}

/* =========================================================
   HEADING
========================================================= */

.eyebrow{

    display:inline-flex;

    align-items:center;

    gap:7px;

    font-size:11px;

    font-weight:750;

    letter-spacing:.8px;

    text-transform:uppercase;

    color:#a78bfa;

    margin-bottom:12px;

}

.eyebrow-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#a78bfa;

    box-shadow:
        0 0 12px
        rgba(167,139,250,.8);

}

h1{

    font-size:32px;

    line-height:1.05;

    letter-spacing:-1.5px;

    margin-bottom:11px;

}

.subtitle{

    color:#a1a1aa;

    font-size:14px;

    line-height:1.65;

    margin-bottom:27px;

}

/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:17px;

}

label{

    display:block;

    font-size:12px;

    font-weight:650;

    color:#d4d4d8;

    margin-bottom:8px;

}

.input-wrap{

    position:relative;

}

.input-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:#71717a;

    width:17px;

    height:17px;

    pointer-events:none;

}

input{

    width:100%;

    height:50px;

    border-radius:13px;

    border:1px solid
        rgba(255,255,255,.09);

    outline:none;

    background:
        rgba(0,0,0,.25);

    color:#fff;

    padding:
        0 14px
        0 43px;

    font-size:14px;

    transition:
        border .2s,
        background .2s,
        box-shadow .2s;

}

input::placeholder{

    color:#52525b;

}

input:focus{

    border-color:
        rgba(139,92,246,.65);

    background:
        rgba(0,0,0,.34);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.10);

}

input.invalid{

    border-color:
        rgba(239,68,68,.75);

}

.field-error{

    min-height:16px;

    color:#f87171;

    font-size:11px;

    margin-top:5px;

}

/* =========================================================
   PHONE
========================================================= */

.phone-row{

    display:grid;

    grid-template-columns:94px 1fr;

    gap:8px;

}

.country-code{

    display:flex;

    align-items:center;

    justify-content:center;

    height:50px;

    border-radius:13px;

    border:1px solid
        rgba(255,255,255,.09);

    background:
        rgba(0,0,0,.25);

    color:#d4d4d8;

    font-size:13px;

    font-weight:650;

}

/* =========================================================
   PASSWORD
========================================================= */

.password-toggle{

    position:absolute;

    right:13px;

    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#71717a;

    cursor:pointer;

    font-size:11px;

    padding:5px;

}

.password-toggle:hover{

    color:#d4d4d8;

}

/* =========================================================
   BUTTONS
========================================================= */

.button-row{

    display:flex;

    gap:10px;

    margin-top:25px;

}

.btn{

    height:50px;

    border-radius:13px;

    border:1px solid
        rgba(255,255,255,.08);

    font-size:13px;

    font-weight:750;

    cursor:pointer;

    transition:
        transform .2s,
        opacity .2s,
        background .2s;

}

.btn:active{

    transform:scale(.98);

}

.btn-primary{

    flex:1;

    color:#fff;

    border:0;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    box-shadow:
        0 12px 30px
        rgba(99,102,241,.23);

}

.btn-primary:hover{

    opacity:.92;

    transform:translateY(-1px);

}

.btn-secondary{

    width:105px;

    color:#d4d4d8;

    background:
        rgba(255,255,255,.045);

}

.btn-secondary:hover{

    background:
        rgba(255,255,255,.08);

}

/* =========================================================
   LOADING
========================================================= */

.btn.loading{

    pointer-events:none;

    opacity:.7;

}

.spinner{

    display:inline-block;

    width:15px;
    height:15px;

    border:2px solid
        rgba(255,255,255,.35);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .7s linear infinite;

    vertical-align:-3px;

    margin-right:7px;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   MESSAGE
========================================================= */

.message{

    display:none;

    margin-top:17px;

    padding:12px 13px;

    border-radius:11px;

    font-size:12px;

    line-height:1.5;

}

.message.show{

    display:block;

}

.message.error{

    color:#fca5a5;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.15);

}

.message.success{

    color:#86efac;

    background:
        rgba(34,197,94,.08);

    border:
        1px solid
        rgba(34,197,94,.15);

}

/* =========================================================
   FOOTER
========================================================= */

.footer-note{

    text-align:center;

    color:#52525b;

    font-size:11px;

    margin-top:22px;

    line-height:1.6;

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

    .page{

        padding:18px;

    }

    .brand{

        top:18px;
        left:20px;

        font-size:18px;

    }

    .auth-card{

        padding:24px 20px;

        border-radius:23px;

    }

    h1{

        font-size:28px;

    }

    .phone-row{

        grid-template-columns:84px 1fr;

    }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .slide-track,
    .progress-fill,
    .btn,
    input{

        transition:none;

    }

}

</style>

</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://olqfwgbrgpywqkxcbjlt.supabase.co";

const SUPABASE_KEY =
"YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const slideTrack =
document.getElementById("slideTrack");

const progressFill =
document.getElementById("progressFill");

const progressText =
document.getElementById("progressText");

const progressNumber =
document.getElementById("progressNumber");

const nextButton =
document.getElementById("nextButton");

const backButton =
document.getElementById("backButton");

const finishButton =
document.getElementById("finishButton");

const message =
document.getElementById("message");

let currentStep = 1;


/* =========================================================
   ALREADY AUTHENTICATED
========================================================= */

async function checkExistingSession(){

    const {
        data
    } = await supabaseClient.auth.getSession();

    if(data && data.session){

        window.location.href =
            "index.html";

    }

}

checkExistingSession();


/* =========================================================
   HELPERS
========================================================= */

function showMessage(
    text,
    type="error"
){

    message.textContent = text;

    message.className =
        "message show " + type;

}


function clearMessage(){

    message.textContent = "";

    message.className =
        "message";

}


function setError(
    id,
    text
){

    const input =
        document.getElementById(id);

    const error =
        document.getElementById(
            id + "Error"
        );

    if(input){

        input.classList.toggle(
            "invalid",
            Boolean(text)
        );

    }

    if(error){

        error.textContent =
            text || "";

    }

}


/* =========================================================
   EMAIL VALIDATION
========================================================= */

function validEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

}


/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function normalizePhone(value){

    let phone =
        value.replace(/\D/g,"");

    if(phone.startsWith("880")){

        phone =
            phone.substring(3);

    }

    if(phone.startsWith("0")){

        phone =
            phone.substring(1);

    }

    return "+880" + phone;

}


/* =========================================================
   CARD 1 VALIDATION
========================================================= */

function validateFirstCard(){

    clearMessage();

    let valid = true;

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!email){

        setError(
            "email",
            "Email is required."
        );

        valid = false;

    }
    else if(!validEmail(email)){

        setError(
            "email",
            "Enter a valid email address."
        );

        valid = false;

    }
    else{

        setError("email","");

    }


    const digits =
        phone.replace(/\D/g,"");


    if(!digits){

        setError(
            "phone",
            "Phone number is required."
        );

        valid = false;

    }
    else if(
        digits.length !== 10 &&
        digits.length !== 11 &&
        !phone.startsWith("880")
    ){

        setError(
            "phone",
            "Enter a valid Bangladesh phone number."
        );

        valid = false;

    }
    else{

        setError("phone","");

    }


    if(!password){

        setError(
            "password",
            "Password is required."
        );

        valid = false;

    }
    else if(password.length < 6){

        setError(
            "password",
            "Password must contain at least 6 characters."
        );

        valid = false;

    }
    else{

        setError(
            "password",
            ""
        );

    }


    return valid;

}


/* =========================================================
   SLIDE TO CARD 2
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        if(
            !validateFirstCard()
        ){

            return;

        }

        currentStep = 2;

        slideTrack.classList.add(
            "second"
        );

        progressFill.style.width =
            "100%";

        progressText.textContent =
            "Profile details";

        progressNumber.textContent =
            "02 / 02";

        clearMessage();

    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    ()=>{

        currentStep = 1;

        slideTrack.classList.remove(
            "second"
        );

        progressFill.style.width =
            "50%";

        progressText.textContent =
            "Account details";

        progressNumber.textContent =
            "01 / 02";

        clearMessage();

    }
);


/* =========================================================
   CARD 2 VALIDATION
========================================================= */

function validateSecondCard(){

    clearMessage();

    let valid = true;

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const age =
        Number(
            document.getElementById(
                "age"
            ).value
        );

    const profession =
        document.getElementById(
            "profession"
        ).value.trim();


    if(!name){

        setError(
            "name",
            "Please enter your name."
        );

        valid = false;

    }
    else{

        setError(
            "name",
            ""
        );

    }


    if(
        !age ||
        age < 1 ||
        age > 120
    ){

        setError(
            "age",
            "Enter a valid age."
        );

        valid = false;

    }
    else{

        setError(
            "age",
            ""
        );

    }


    if(!profession){

        setError(
            "profession",
            "Please enter your profession."
        );

        valid = false;

    }
    else{

        setError(
            "profession",
            ""
        );

    }


    return valid;

}


/* =========================================================
   CREATE / LOGIN
========================================================= */

finishButton.addEventListener(
    "click",
    async ()=>{

        if(
            !validateSecondCard()
        ){

            return;

        }


        finishButton.classList.add(
            "loading"
        );

        finishButton.innerHTML =
            '<span class="spinner"></span>Setting up...';


        try{

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;

            const phoneInput =
                document.getElementById(
                    "phone"
                ).value.trim();

            const phone =
                normalizePhone(
                    phoneInput
                );

            const name =
                document.getElementById(
                    "name"
                ).value.trim();

            const age =
                Number(
                    document.getElementById(
                        "age"
                    ).value
                );

            const profession =
                document.getElementById(
                    "profession"
                ).value.trim();


            /* =========================================
               SIGN UP
            ========================================= */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email:email,

                    password:password,

                    options:{

                        data:{

                            name:name,

                            phone:phone,

                            age:age,

                            profession:profession

                        }

                    }

                });


            if(error){

                /*
                 * If email already belongs to an account,
                 * Supabase should handle authentication normally.
                 * We do NOT bypass authentication based only
                 * on email or phone.
                 */

                throw error;

            }


            if(!data.user){

                throw new Error(
                    "Account could not be created."
                );

            }


            /* =========================================
               PROFILE
            ========================================= */

            const {
                error:
                profileError
            } =
                await supabaseClient
                .from("profiles")
                .upsert({

                    id:data.user.id,

                    name:name,

                    email:email,

                    phone:phone,

                    age:age,

                    profession:profession

                });


            if(profileError){

                throw profileError;

            }


            /* =========================================
               EMAIL CONFIRMATION
            ========================================= */

            if(
                !data.session
            ){

                showMessage(
                    "Account created. Check your email to confirm your account before entering UI Areena.",
                    "success"
                );

                finishButton.classList.remove(
                    "loading"
                );

                finishButton.textContent =
                    "Enter UI Areena";

                return;

            }


            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(
                "Welcome to UI Areena!",
                "success"
            );


            setTimeout(
                ()=>{

                    window.location.href =
                        "index.html";

                },
                600
            );


        }
        catch(error){

            console.error(error);

            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

            finishButton.classList.remove(
                "loading"
            );

            finishButton.textContent =
                "Enter UI Areena";

        }

    }
);


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

document.getElementById(
    "passwordToggle"
)
.addEventListener(
    "click",
    ()=>{

        const password =
            document.getElementById(
                "password"
            );

        const button =
            document.getElementById(
                "passwordToggle"
            );


        if(
            password.type === "password"
        ){

            password.type =
                "text";

            button.textContent =
                "Hide";

        }
        else{

            password.type =
                "password";

            button.textContent =
                "Show";

        }

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key !== "Enter"
        ){

            return;

        }

        if(
            currentStep === 1
        ){

            nextButton.click();

        }
        else{

            finishButton.click();

        }

    }
);


/* =========================================================
   CLEAR ERRORS WHILE TYPING
========================================================= */

[
    "email",
    "phone",
    "password",
    "name",
    "age",
    "profession"
]
.forEach(
    id=>{

        const input =
            document.getElementById(id);

        input.addEventListener(
            "input",
            ()=>{

                setError(
                    id,
                    ""
                );

                clearMessage();

            }
        );

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (
        event,
        session
    )=>{

        if(
            event === "SIGNED_IN" &&
            session
        ){

            /*
             * Do not immediately redirect here during
             * profile creation. The main flow handles it.
             */

        }

    }
);

</script>

</html>
