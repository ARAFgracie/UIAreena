<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORGE/UI — Architecture</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#08090c;color:#f5f5f5}body.light{background:#f4f5f1;color:#111}nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;position:sticky;top:0;background:#08090ccc;backdrop-filter:blur(18px);z-index:5}.light nav{background:#f4f5f1dd}.logo{font-weight:900}.dots{background:#151820;color:inherit;border:1px solid #ffffff18;border-radius:10px;padding:10px 15px;font-size:18px}.side{position:fixed;right:0;top:0;bottom:0;width:300px;background:#101217;z-index:20;padding:20px;transform:translateX(100%);transition:.3s}.side.open{transform:translateX(0)}.side a,.side button{display:block;width:100%;padding:12px;margin:5px 0;background:#151820;color:#fff;border:1px solid #ffffff12;border-radius:9px;text-decoration:none}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}.overlay.show{display:block}main{width:min(1200px,90%);margin:auto;padding:70px 0}.hero h1{font-size:70px;letter-spacing:-5px}.hero p{color:#888;line-height:1.7;max-width:650px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:30px 0}.tabs button{padding:10px 13px;border-radius:9px;border:1px solid #ffffff15;background:#151820;color:#aaa}.tabs button.active{background:#c8ff45;color:#111}.canvas{overflow:auto;border:1px solid #ffffff12;border-radius:20px;padding:60px;background:#101217}.flow{min-width:900px;display:flex;align-items:center;gap:12px}.node{width:150px;min-height:100px;padding:15px;border:1px solid #ffffff14;background:#151820;border-radius:14px}.node small{color:#777;font:9px monospace}.node strong{display:block;margin-top:10px}.node span{font-size:10px;color:#777}.arrow{color:#c8ff45;font-size:22px}
</style></head><body><nav><div class="logo">FORGE/UI</div><button class="dots" onclick="openSide()">⋯</button></nav><div class="overlay" id="ov" onclick="closeSide()"></div><aside class="side" id="side"><button onclick="closeSide()">Close</button><a href="index.html">Home</a><a href="ui-library.html">UI Library</a><a href="navbar.html">Navbar</a><a href="buttons.html">Buttons</a><a href="cards.html">Cards</a><a href="forms.html">Forms</a><a href="prompts.html">Prompts</a><button onclick="document.body.classList.toggle('light')">☼ / ☾ Theme</button></aside><main><section class="hero"><h1>Architecture.</h1><p>Show the connective path of a website before building it. Select a model and understand entry, discovery, action and output at a glance.</p></section><div class="tabs" id="tabs"></div><div class="canvas"><div class="flow" id="flow"></div></div></main><script>
const data={Ecommerce:["Homepage","Categories","Product Listing","Product Details","Cart","Checkout","Success"],Blog:["Home","Topics","Article List","Article","Author","Related"],SaaS:["Landing","Pricing","Login","Dashboard","Workspace","Settings"],Portfolio:["Home","Work","Case Study","About","Experience","Contact"],News:["Home","Topics","Story","Article","Author","Related"],Clothing:["Home","Collections","Category","Product","Size","Cart","Checkout"],Education:["Home","Courses","Course","Enrollment","Learning","Lesson","Progress"],Restaurant:["Home","Menu","Dish","Reservation","Confirmation"]};
tabs.innerHTML=Object.keys(data).map((x,i)=>'<button class="'+(!i?'active':'')+'" onclick="show(\''+x+'\',this)">'+x+'</button>').join("");function show(k,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');flow.innerHTML=data[k].map((x,i)=>'<div class="node"><small>STEP '+String(i+1).padStart(2,'0')+'</small><strong>'+x+'</strong><span>User journey node</span></div>'+ (i<data[k].length-1?'<div class="arrow">→</div>':'')).join('')}show("Ecommerce",document.querySelector('.tabs button'));function openSide(){side.classList.add('open');ov.classList.add('show')}function closeSide(){side.classList.remove('open');ov.classList.remove('show')}</script></body></html>
